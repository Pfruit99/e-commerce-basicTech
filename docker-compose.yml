# PostgreSQL para desarrollo local. Credenciales en .env (ver .env.example).
# Uso: docker compose up -d
services:
  db:
    image: postgres:18-alpine
    container_name: basictech-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-basictech}
    ports:
      # Solo localhost: la base no queda expuesta en la red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 guarda los datos en /var/lib/postgresql/18/docker; se monta el padre.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
